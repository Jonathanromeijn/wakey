<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Wakey 3D — Industrial Product Design</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700&family=Instrument+Sans:wght@400;500;600&display=swap">
<script src="https://cdn.tailwindcss.com"></script>
<style>
  :root {
    --dawn: 0.35;
    --bg-warm: #1e1814;
  }
  * {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
  }
  html, body {
    margin: 0;
    height: 100%;
    overflow: hidden;
    background: #120f0d;
    font-family: 'Instrument Sans', system-ui, -apple-system, sans-serif;
    color: #f3ede4;
    user-select: none;
  }
  #stage {
    position: fixed;
    inset: 0;
    touch-action: none;
    cursor: grab;
    background:
      radial-gradient(ellipse 75% 65% at 50% 42%,
        rgba(56, 42, 33, 1) 0%,
        rgba(27, 22, 19, 1) 58%,
        rgba(15, 12, 10, 1) 100%);
    transition: background 0.3s ease;
  }
  #stage::before {
    content: "";
    position: absolute;
    inset: 0;
    pointer-events: none;
    background:
      radial-gradient(circle at 50% 34%,
        rgba(255, 184, 108, calc(var(--dawn) * 0.48)) 0%,
        rgba(242, 145, 65, calc(var(--dawn) * 0.22)) 38%,
        rgba(242, 166, 90, 0) 72%);
    mix-blend-mode: screen;
  }
  #stage::after {
    content: "";
    position: absolute;
    inset: 0;
    pointer-events: none;
    box-shadow: inset 0 0 120px rgba(0, 0, 0, 0.65);
  }
  #stage:active {
    cursor: grabbing;
  }
  #stage.pointer-hover {
    cursor: pointer;
  }
  #stage.showcase-mode,
  #stage.showcase-mode:active {
    cursor: default;
  }
  #stage canvas {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    display: block;
  }

  /* Glass control panel, wakey house style: white glass + orange accent */
  .glass-panel {
    background: rgba(255, 255, 255, 0.86);
    backdrop-filter: blur(20px) saturate(140%);
    -webkit-backdrop-filter: blur(20px) saturate(140%);
    border: 1px solid rgba(255, 255, 255, 0.6);
    box-shadow:
      0 20px 50px rgba(0, 0, 0, 0.35),
      inset 0 1px 0 rgba(255, 255, 255, 0.7);
  }

  .glass-pill {
    background: rgba(10, 10, 10, 0.04);
    border: 1px solid rgba(10, 10, 10, 0.08);
    color: #0a0a0a;
    transition: all 0.2s cubic-bezier(0.2, 0.8, 0.2, 1);
  }
  .glass-pill:hover {
    background: rgba(10, 10, 10, 0.08);
    border-color: rgba(10, 10, 10, 0.16);
    transform: translateY(-1px);
  }
  .glass-pill:active {
    transform: translateY(0) scale(0.98);
  }
  .glass-pill.active {
    background: linear-gradient(135deg, #ff5a1f, #ff7a45);
    border-color: #ff5a1f;
    color: #fff;
    box-shadow: 0 4px 16px rgba(255, 90, 31, 0.35);
  }

  /* Custom range slider voor Dawn Simulator */
  input[type="range"].dawn-slider {
    -webkit-appearance: none;
    appearance: none;
    background: transparent;
    cursor: pointer;
  }
  input[type="range"].dawn-slider::-webkit-slider-runnable-track {
    height: 6px;
    border-radius: 999px;
    background: linear-gradient(90deg, #2b2420 0%, #9b6434 50%, #ffcf8c 100%);
    border: 1px solid rgba(255, 255, 255, 0.1);
  }
  input[type="range"].dawn-slider::-webkit-slider-thumb {
    -webkit-appearance: none;
    appearance: none;
    width: 18px;
    height: 18px;
    border-radius: 50%;
    background: #ffffff;
    border: 2px solid #ff5a1f;
    margin-top: -7px;
    box-shadow: 0 2px 8px rgba(0, 0, 0, 0.25), 0 0 12px rgba(255, 90, 31, 0.45);
    transition: transform 0.15s ease;
  }
  input[type="range"].dawn-slider::-webkit-slider-thumb:hover {
    transform: scale(1.15);
  }
  input[type="range"].dawn-slider::-moz-range-track {
    height: 6px;
    border-radius: 999px;
    background: linear-gradient(90deg, #2b2420 0%, #9b6434 50%, #ffcf8c 100%);
    border: 1px solid rgba(255, 255, 255, 0.1);
  }
  input[type="range"].dawn-slider::-moz-range-thumb {
    width: 18px;
    height: 18px;
    border-radius: 50%;
    background: #ffffff;
    border: 2px solid #ff5a1f;
    box-shadow: 0 2px 8px rgba(0, 0, 0, 0.25);
  }

  @keyframes pulseGlow {
    0%, 100% { opacity: 0.7; }
    50% { opacity: 1; }
  }
  .status-dot {
    animation: pulseGlow 2.4s infinite ease-in-out;
  }
</style>
</head>
<body>

<div id="stage"></div>

<!-- Subtle brand header, top left -->
<header class="fixed top-4 left-4 sm:top-6 sm:left-7 z-20 pointer-events-none flex items-center gap-3">
  <div class="glass-panel rounded-2xl px-3.5 py-2 sm:px-4 sm:py-2.5 flex items-center gap-3">
    <div class="w-2.5 h-2.5 rounded-full bg-amber-300 status-dot shadow-[0_0_10px_#fcd34d]" id="header-led"></div>
    <div>
      <div class="flex items-center gap-2">
        <span class="font-semibold tracking-wider text-xs sm:text-sm uppercase text-[#0a0a0a]" style="font-family: 'Archivo', sans-serif;">Wakey 3D</span>
        <span class="text-[10px] px-1.5 py-0.5 rounded-md bg-[#ff5a1f]/10 text-[#ff5a1f] border border-[#ff5a1f]/25 font-medium">MK-II Walnut</span>
      </div>
      <p class="text-[11px] text-stone-500 hidden sm:block" id="hint-text">Drag to rotate · Scroll to zoom · Click a button or the screen</p>
    </div>
  </div>
</header>

<!-- Feedback toast / status message -->
<div id="toast" class="fixed top-4 right-4 sm:top-6 sm:right-7 z-20 pointer-events-none opacity-0 transition-all duration-300 translate-y-[-6px]">
  <div class="glass-panel rounded-xl px-3.5 py-2 text-xs sm:text-sm text-[#0a0a0a] flex items-center gap-2">
    <span class="w-1.5 h-1.5 rounded-full bg-[#ff5a1f]"></span>
    <span id="toast-msg">Status updated</span>
  </div>
</div>

<!-- Floating glass control bar at the bottom -->
<nav aria-label="Alarm clock controls" class="fixed bottom-4 sm:bottom-6 left-1/2 -translate-x-1/2 z-20 w-[94%] max-w-3xl">
  <div class="glass-panel rounded-2xl sm:rounded-3xl p-2.5 sm:p-3.5 flex flex-col md:flex-row items-center justify-between gap-2.5 sm:gap-4">

    <!-- Camera viewpoints -->
    <div class="flex items-center gap-1.5 w-full md:w-auto justify-center">
      <button id="btn-front" class="glass-pill active rounded-xl px-3 py-2 text-xs font-medium flex items-center gap-1.5 flex-1 md:flex-initial justify-center" title="View the mechanical flip display">
        <svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <rect x="3" y="5" width="18" height="14" rx="3"/>
          <line x1="3" y1="12" x2="21" y2="12"/>
        </svg>
        <span>Front <span class="hidden sm:inline opacity-60">(Flip)</span></span>
      </button>

      <button id="btn-back" class="glass-pill rounded-xl px-3 py-2 text-xs font-medium flex items-center gap-1.5 flex-1 md:flex-initial justify-center" title="Rotate to the interactive touchscreen">
        <svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <rect x="3" y="5" width="18" height="14" rx="3"/>
          <circle cx="8" cy="12" r="2"/>
          <path d="M14 9h4M14 12h4M14 15h2"/>
        </svg>
        <span>Back <span class="hidden sm:inline opacity-60">(Touch)</span></span>
      </button>

      <button id="btn-top" class="glass-pill rounded-xl px-3 py-2 text-xs font-medium flex items-center gap-1.5 flex-1 md:flex-initial justify-center" title="View the light strip and rotary knob">
        <svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="8"/>
          <circle cx="12" cy="12" r="3"/>
        </svg>
        <span>Top</span>
      </button>
    </div>

    <!-- Divider -->
    <div class="hidden md:block w-px h-7 bg-black/10"></div>

    <!-- Wake light (Dawn Simulator) -->
    <div class="flex items-center gap-2.5 w-full md:w-auto px-1">
      <button id="btn-dawn-toggle" class="p-1.5 rounded-lg hover:bg-black/5 transition text-[#ff5a1f]" title="Start or stop the sunrise simulation">
        <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="4"/>
          <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/>
        </svg>
      </button>
      <div class="flex flex-col flex-1 md:w-36">
        <div class="flex justify-between text-[10px] text-stone-500 mb-1">
          <span>Wake light</span>
          <span id="dawn-pct" class="font-mono text-[#ff5a1f]">35%</span>
        </div>
        <input id="dawn-slider" type="range" min="0" max="100" value="35" class="dawn-slider w-full" aria-label="Wake light intensity">
      </div>
    </div>

    <!-- Divider -->
    <div class="hidden md:block w-px h-7 bg-black/10"></div>

    <!-- Time simulation & flip test -->
    <div class="flex items-center gap-1.5 w-full md:w-auto justify-center">
      <button id="btn-flip-min" class="glass-pill rounded-xl px-2.5 py-2 text-xs font-medium flex items-center gap-1.5 flex-1 md:flex-initial justify-center" title="Flip the clock forward by 1 minute">
        <svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <polyline points="23 4 23 10 17 10"/>
          <path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/>
        </svg>
        <span>+1 Min</span>
      </button>

      <button id="btn-flip-hour" class="glass-pill rounded-xl px-2.5 py-2 text-xs font-medium flex items-center gap-1.5 flex-1 md:flex-initial justify-center" title="Flip hour, minute and day together">
        <span>+1 Hour</span>
      </button>

      <button id="btn-demo" class="glass-pill rounded-xl px-3 py-2 text-xs font-medium flex items-center gap-1.5 flex-1 md:flex-initial justify-center" title="Start a full sunrise and alarm demo">
        <svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="currentColor">
          <polygon points="6 4 20 12 6 20 6 4"/>
        </svg>
        <span id="demo-label">Alarm demo</span>
      </button>
    </div>

  </div>
</nav>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(async function () {
  const stage = document.getElementById('stage');
  const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  // Showcase mode (used in the homepage overlay): no free drag-rotate, front/back view only
  const showcaseMode = new URLSearchParams(location.search).get('mode') === 'showcase';
  if (showcaseMode) {
    stage.classList.add('showcase-mode');
    const hintText = document.getElementById('hint-text');
    if (hintText) hintText.textContent = 'Tap "Front" or "Back" to switch views · Click a button or the screen';
  }

  // Wacht kort op Google Fonts zodat het canvas scherp tekent
  try {
    await Promise.race([
      Promise.all([
        document.fonts.load('600 100px Archivo'),
        document.fonts.load('500 30px "Instrument Sans"')
      ]),
      new Promise(r => setTimeout(r, 1500))
    ]);
  } catch (e) {}

  // ---------- Toast helper ----------
  let toastTimeout = null;
  function showToast(msg) {
    const el = document.getElementById('toast');
    const txt = document.getElementById('toast-msg');
    txt.textContent = msg;
    el.classList.remove('opacity-0', 'translate-y-[-6px]');
    el.classList.add('opacity-100', 'translate-y-0');
    clearTimeout(toastTimeout);
    toastTimeout = setTimeout(() => {
      el.classList.add('opacity-0', 'translate-y-[-6px]');
      el.classList.remove('opacity-100', 'translate-y-0');
    }, 2400);
  }

  // ---------- Web Audio mechanisch flip-geluid (subtiel & procedureel) ----------
  let audioCtx = null;
  function playFlipClick(intensity = 1) {
    try {
      if (!audioCtx) {
        const AC = window.AudioContext || window.webkitAudioContext;
        if (!AC) return;
        audioCtx = new AC();
      }
      if (audioCtx.state === 'suspended') audioCtx.resume();
      const now = audioCtx.currentTime;
      const bufSize = Math.floor(audioCtx.sampleRate * 0.022);
      const buf = audioCtx.createBuffer(1, bufSize, audioCtx.sampleRate);
      const data = buf.getChannelData(0);
      for (let i = 0; i < bufSize; i++) {
        data[i] = (Math.random() * 2 - 1) * Math.exp(-i / (bufSize * 0.22));
      }
      const noise = audioCtx.createBufferSource();
      noise.buffer = buf;

      const filter = audioCtx.createBiquadFilter();
      filter.type = 'bandpass';
      filter.frequency.setValueAtTime(1400 + Math.random() * 350, now);
      filter.Q.value = 2.4;

      const gain = audioCtx.createGain();
      gain.gain.setValueAtTime(0.08 * intensity, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.022);

      noise.connect(filter);
      filter.connect(gain);
      gain.connect(audioCtx.destination);
      noise.start(now);
    } catch (e) {}
  }

  function playRotaryTick() {
    try {
      if (!audioCtx) {
        const AC = window.AudioContext || window.webkitAudioContext;
        if (!AC) return;
        audioCtx = new AC();
      }
      if (audioCtx.state === 'suspended') audioCtx.resume();
      const now = audioCtx.currentTime;
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'triangle';
      osc.frequency.setValueAtTime(920, now);
      osc.frequency.exponentialRampToValueAtTime(280, now + 0.015);
      gain.gain.setValueAtTime(0.04, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.015);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start(now);
      osc.stop(now + 0.016);
    } catch (e) {}
  }

  // ---------- Renderer & Scene ----------
  let renderer;
  try {
    renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, powerPreference: 'high-performance' });
  } catch (err) {
    stage.innerHTML = '<div style="position:fixed;inset:0;display:flex;align-items:center;justify-content:center;color:#f3ede4;padding:24px;text-align:center;">WebGL could not be started in this browser.</div>';
    return;
  }

  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
  renderer.outputEncoding = THREE.sRGBEncoding;
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.15;
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  stage.prepend(renderer.domElement);
  const aniso = renderer.capabilities.getMaxAnisotropy ? renderer.capabilities.getMaxAnisotropy() : 1;

  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(32, (window.innerWidth || 800) / (window.innerHeight || 600), 0.1, 100);

  // ---------- Procedurele Studio Environment Map (met veilige fallback) ----------
  function buildStudioEnvironment() {
    try {
      const pmrem = new THREE.PMREMGenerator(renderer);
      pmrem.compileEquirectangularShader();

      const envScene = new THREE.Scene();
      envScene.background = new THREE.Color(0x1b1410);

      const softbox1 = new THREE.Mesh(
        new THREE.PlaneGeometry(12, 8),
        new THREE.MeshBasicMaterial({ color: 0xffe4c4, side: THREE.DoubleSide })
      );
      softbox1.position.set(-8, 7, 7);
      softbox1.lookAt(0, 0, 0);
      envScene.add(softbox1);

      const softbox2 = new THREE.Mesh(
        new THREE.PlaneGeometry(10, 6),
        new THREE.MeshBasicMaterial({ color: 0xb8cdf8, side: THREE.DoubleSide })
      );
      softbox2.position.set(9, 4, -8);
      softbox2.lookAt(0, 0, 0);
      envScene.add(softbox2);

      const topStrip = new THREE.Mesh(
        new THREE.PlaneGeometry(14, 3),
        new THREE.MeshBasicMaterial({ color: 0xffd2a0, side: THREE.DoubleSide })
      );
      topStrip.position.set(0, 10, 0);
      topStrip.rotation.x = Math.PI / 2;
      envScene.add(topStrip);

      const envRT = pmrem.fromScene(envScene, 0.04);
      scene.environment = envRT.texture;
      pmrem.dispose();
    } catch (e) {
      // Fallback zonder PMREM als de omgeving dit niet ondersteunt
      scene.environment = null;
    }
  }
  buildStudioEnvironment();

  // ---------- Afmetingen (1 eenheid = 10 cm) ----------
  const W = 2.8, H = 1.2, D = 0.95, R = 0.24, BV = 0.05;
  const Wi = 2.5, Hi = 0.92;
  const FOOT_H = 0.032; // Hoogte rubberen voetjes zodat de wekker realistisch op het oppervlak staat

  function rr(p, x, y, w, h, r) {
    p.moveTo(x + r, y);
    p.lineTo(x + w - r, y);
    p.quadraticCurveTo(x + w, y, x + w, y + r);
    p.lineTo(x + w, y + h - r);
    p.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
    p.lineTo(x + r, y + h);
    p.quadraticCurveTo(x, y + h, x, y + h - r);
    p.lineTo(x, y + r);
    p.quadraticCurveTo(x, y, x + r, y);
    return p;
  }
  function ctxRR(ctx, x, y, w, h, r) {
    ctx.beginPath();
    rr(ctx, x, y, w, h, r);
    ctx.closePath();
  }

  // ---------- Rijke Amerikaanse Walnoothout Textures (Albedo + Bump + Roughness) ----------
  function makeWalnutTextures() {
    const w = 1024, h = 512;
    const colC = document.createElement('canvas'); colC.width = w; colC.height = h;
    const bmpC = document.createElement('canvas'); bmpC.width = w; bmpC.height = h;
    const rghC = document.createElement('canvas'); rghC.width = w; rghC.height = h;

    const cg = colC.getContext('2d');
    const bg = bmpC.getContext('2d');
    const rg = rghC.getContext('2d');

    // Warme diepe basislaag
    const baseGrad = cg.createLinearGradient(0, 0, w, h);
    baseGrad.addColorStop(0, '#4f2f1b');
    baseGrad.addColorStop(0.5, '#5a3620');
    baseGrad.addColorStop(1, '#442716');
    cg.fillStyle = baseGrad;
    cg.fillRect(0, 0, w, h);

    bg.fillStyle = '#808080';
    bg.fillRect(0, 0, w, h);

    rg.fillStyle = '#686868'; // Zijdeglans basis
    rg.fillRect(0, 0, w, h);

    let seed = 42;
    const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;

    // Organische nerven en jaarringen
    for (let i = 0; i < 420; i++) {
      const y0 = rnd() * h;
      const amp = 2.5 + rnd() * 11;
      const f = 0.0025 + rnd() * 0.007;
      const ph = rnd() * Math.PI * 2;
      const isDark = rnd() < 0.65;
      const lw = 0.6 + rnd() * 3.4;

      cg.strokeStyle = isDark
        ? `rgba(26, 13, 6, ${0.09 + rnd() * 0.30})`
        : `rgba(155, 102, 62, ${0.06 + rnd() * 0.20})`;
      cg.lineWidth = lw;

      bg.strokeStyle = isDark
        ? `rgba(45, 45, 45, ${0.15 + rnd() * 0.25})`
        : `rgba(200, 200, 200, ${0.1 + rnd() * 0.15})`;
      bg.lineWidth = lw;

      rg.strokeStyle = isDark
        ? `rgba(145, 145, 145, 0.22)`
        : `rgba(85, 85, 85, 0.18)`;
      rg.lineWidth = lw;

      [cg, bg, rg].forEach(ctx => {
        ctx.beginPath();
        for (let x = -10; x <= w + 10; x += 8) {
          const y = y0
            + Math.sin(x * f + ph) * amp
            + Math.sin(x * f * 2.9 + ph * 1.7) * (amp * 0.28);
          if (x < 0) ctx.moveTo(x, y);
          else ctx.lineTo(x, y);
        }
        ctx.stroke();
      });
    }

    // Fijne houtporiën
    for (let i = 0; i < 3600; i++) {
      const px = rnd() * w;
      const py = rnd() * h;
      const pw = 2 + rnd() * 9;
      cg.fillStyle = `rgba(18, 8, 3, ${0.16 + rnd() * 0.28})`;
      cg.fillRect(px, py, pw, 1.1);
      bg.fillStyle = `rgba(30, 30, 30, 0.35)`;
      bg.fillRect(px, py, pw, 1.1);
      rg.fillStyle = `rgba(175, 175, 175, 0.3)`;
      rg.fillRect(px, py, pw, 1.1);
    }

    const setupTex = (canvas, isSRGB) => {
      const t = new THREE.CanvasTexture(canvas);
      t.wrapS = t.wrapT = THREE.RepeatWrapping;
      t.repeat.set(0.35, 0.68);
      t.anisotropy = aniso;
      if (isSRGB) t.encoding = THREE.sRGBEncoding;
      return t;
    };

    return {
      map: setupTex(colC, true),
      bumpMap: setupTex(bmpC, false),
      roughnessMap: setupTex(rghC, false)
    };
  }

  const woodMaps = makeWalnutTextures();
  const woodMat = new THREE.MeshStandardMaterial({
    map: woodMaps.map,
    bumpMap: woodMaps.bumpMap,
    bumpScale: 0.005,
    roughnessMap: woodMaps.roughnessMap,
    roughness: 0.44,
    metalness: 0.04
  });

  // Geborsteld messing / brons accentmateriaal
  const brassMat = new THREE.MeshStandardMaterial({
    color: 0xd8a86e,
    metalness: 0.85,
    roughness: 0.26
  });

  // Donker geanodiseerd aluminium / metaal voor as en scharnieren
  const gunmetalMat = new THREE.MeshStandardMaterial({
    color: 0x2a2522,
    metalness: 0.78,
    roughness: 0.34
  });

  // Mat zwart silicone / rubber voor voetjes en binnenwerk
  const rubberMat = new THREE.MeshStandardMaterial({
    color: 0x12100f,
    roughness: 0.88,
    metalness: 0.05
  });

  const clock = new THREE.Group();
  clock.position.y = FOOT_H; // Rust exact op de rubberen voetjes
  scene.add(clock);

  // ---------- Houten Behuizing ----------
  const bodyShape = rr(
    new THREE.Shape(),
    -(W - 2 * BV) / 2,
    -(H - 2 * BV) / 2,
    W - 2 * BV,
    H - 2 * BV,
    R - BV
  );
  const bodyGeo = new THREE.ExtrudeGeometry(bodyShape, {
    depth: D - 2 * BV,
    bevelEnabled: true,
    bevelThickness: BV,
    bevelSize: BV,
    bevelSegments: 8,

  body.receiveShadow = true;

  const footGeo = new THREE.CylinderGeometry(0.11, 0.125, FOOT_H + 0.01, 24);
  const footPositions = [
    [-W / 2 + 0.34, -H / 2 - FOOT_H / 2 + 0.005, D / 2 - 0.22],
    [W / 2 - 0.34, -H / 2 - FOOT_H / 2 + 0.005, D / 2 - 0.22],
    [-W / 2 + 0.34, -H / 2 - FOOT_H / 2 + 0.005, -D / 2 + 0.22],

  // ---------- Houten Randen + Geborstelde Messing Accent-Bezels ----------
  function makeWoodRing() {
    const s = rr(new THREE.Shape(), -(W - 0.15) / 2, -(H - 0.15) / 2, W - 0.15, H - 0.15, R - 0.075);
    s.holes.push(rr(new THREE.Path(), -(Wi + 0.036) / 2, -(Hi + 0.036) / 2, Wi + 0.036, Hi + 0.036, 0.088));
    const g = new THREE.ExtrudeGeometry(s, {
      depth: 0.036,
      bevelEnabled: true,
      bevelThickness: 0.012,
      bevelSize: 0.012,
      bevelSegments: 4,
      curveSegments: 24
    });
    const m = new THREE.Mesh(g, woodMat);
    m.castShadow = true;
    m.receiveShadow = true;
    return m;
  }

  function makeBrassBezel() {
    const outerW = Wi + 0.042, outerH = Hi + 0.042;
    const s = rr(new THREE.Shape(), -outerW / 2, -outerH / 2, outerW, outerH, 0.092);
    s.holes.push(rr(new THREE.Path(), -Wi / 2, -Hi / 2, Wi, Hi, 0.072));
    const g = new THREE.ExtrudeGeometry(s, {
      depth: 0.042,
      bevelEnabled: true,
      bevelThickness: 0.006,
      bevelSize: 0.006,
      bevelSegments: 3,
      curveSegments: 24
    });

    m.castShadow = true;
    m.receiveShadow = true;
    return m;
  }

  function roundedPlane(w, h, r) {
    const g = new THREE.ShapeGeometry(rr(new THREE.Shape(), -w / 2, -h / 2, w, h, r), 20);
    const pos = g.attributes.position, uv = g.attributes.uv;
    for (let i = 0; i < pos.count; i++) {
      uv.setXY(i, (pos.getX(i) + w / 2) / w, (pos.getY(i) + h / 2) / h);

    return g;

  const darkCavityMat = new THREE.MeshStandardMaterial({ color: 0x090807, roughness: 0.92, metalness: 0.1 });

  function cardBase(ctx, w, h) {
    ctx.clearRect(0, 0, w, h);
    // Rijke geanodiseerde matzwarte kaart met subtiele verlichting van boven
    const g = ctx.createLinearGradient(0, 0, 0, h);
    g.addColorStop(0, '#2f2b27');
    g.addColorStop(0.48, '#211e1b');
    g.addColorStop(0.52, '#1b1815');
    g.addColorStop(1, '#12100e');
    ctx.fillStyle = g;
    ctxRR(ctx, 2, 2, w - 4, h - 4, 28);
    ctx.fill();

    // Fijne geborstelde textuur
    for (let i = 0; i < 1100; i++) {
      ctx.fillStyle = `rgba(255,250,240,${Math.random() * 0.024})`;
      ctx.fillRect(Math.random() * w, Math.random() * h, 3, 1.5);
    }

    // Subtiele randhighlight op de kaart
    ctx.strokeStyle = 'rgba(255, 240, 220, 0.09)';
    ctx.lineWidth = 2;
    ctxRR(ctx, 3, 3, w - 6, h - 6, 27);
    ctx.stroke();
  }

  function cardSplit(ctx, w, h) {
    // Diepe mechanische spleet met schaduw boven en glansrand onder
    const shadowGrad = ctx.createLinearGradient(0, h / 2 - 14, 0, h / 2);
    shadowGrad.addColorStop(0, 'rgba(0,0,0,0)');
    shadowGrad.addColorStop(1, 'rgba(0,0,0,0.65)');
    ctx.fillStyle = shadowGrad;
    ctx.fillRect(2, h / 2 - 14, w - 4, 14);

    ctx.fillStyle = '#050403';
    ctx.fillRect(0, h / 2 - 3.5, w, 7);

    // Highlight op de bovenrand van de onderste kaarthelft
    ctx.fillStyle = 'rgba(255, 245, 230, 0.14)';
    ctx.fillRect(4, h / 2 + 3.5, w - 8, 2.5);

    // Uitsparingen links en rechts voor de scharnierpinnen
    ctx.fillStyle = '#070605';
    ctx.fillRect(0, h / 2 - 16, 14, 32);
    ctx.fillRect(w - 14, h / 2 - 16, 14, 32);
  }

  const ink = '#f2ece1';
  function drawDigits(ctx, w, h, key) {
    cardBase(ctx, w, h);
    let size = h * 0.80;
    ctx.font = `600 ${size}px Archivo, "Helvetica Neue", Arial, sans-serif`;
    const m = ctx.measureText(key).width;
    if (m > w * 0.85) {
      size *= (w * 0.85) / m;
      ctx.font = `600 ${size}px Archivo, "Helvetica Neue", Arial, sans-serif`;
    }
    ctx.fillStyle = ink;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(key, w / 2, h * 0.535);
    cardSplit(ctx, w, h);
  }

  function drawMoon(ctx, cx, cy, r, p) {
    ctx.save();
    ctx.translate(cx, cy);
    ctx.strokeStyle = 'rgba(242, 236, 225, 0.75)';
    ctx.lineWidth = 2.8;
    ctx.beginPath();
    ctx.arc(0, 0, r, 0, Math.PI * 2);
    ctx.stroke();

    if (p >= 0.5) ctx.scale(-1, 1);
    const k = Math.cos(2 * Math.PI * p);
    ctx.fillStyle = ink;
    ctx.beginPath();
    ctx.arc(0, 0, r, -Math.PI / 2, Math.PI / 2, false);
    ctx.ellipse(0, 0, Math.max(0.01, r * Math.abs(k)), r, 0, Math.PI / 2, -Math.PI / 2, k > 0);
    ctx.fill();
    ctx.restore();
  }

  function drawDay(ctx, w, h, key) {
    cardBase(ctx, w, h);
    const [day, ph] = key.split('|');
    ctx.font = `600 ${h * 0.19}px Archivo, "Helvetica Neue", Arial, sans-serif`;
    ctx.fillStyle = '#d8c5a8'; // Subtiel warme tint voor de dagnaam
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(day, w / 2, h * 0.26);
    drawMoon(ctx, w / 2, h * 0.75, w * 0.18, parseFloat(ph));

  function halves(canvas) {
    const top = new THREE.CanvasTexture(canvas);
    top.encoding = THREE.sRGBEncoding;
    top.anisotropy = aniso;
    top.repeat.set(1, 0.5);
    top.offset.set(0, 0.5);

    const bot = top.clone();
    bot.offset.set(0, 0);
    bot.needsUpdate = true;
    return { top, bot };
  }

  function setMap(mesh, t) {
    if (mesh.material.map !== t) {
      mesh.material.map = t;
      mesh.material.needsUpdate = true;
    }
  }

  class Flip {
    constructor(w, h, draw, x) {
      this.w = w;
      this.h = h;
      this.draw = draw;
      this.cache = new Map();
      this.key = null;
      this.anim = null;
      this.prev = null;

      this.group = new THREE.Group();
      this.group.position.set(x, 0, D / 2 + 0.026);

      const hg = new THREE.PlaneGeometry(w, h / 2);
      const cardMat = () => new THREE.MeshStandardMaterial({
        roughness: 0.42,
        metalness: 0.08,
        alphaTest: 0.5
      });

      this.top = new THREE.Mesh(hg, cardMat());
      this.top.position.y = h / 4;

      this.bot = new THREE.Mesh(hg, cardMat());
      this.bot.position.y = -h / 4;

      this.pivot = new THREE.Group();
      this.pivot.position.z = 0.005;
      this.pivot.visible = false;

      this.fF = new THREE.Mesh(hg, cardMat());
      this.fF.position.y = h / 4;

      this.fB = new THREE.Mesh(hg, cardMat());
      this.fB.position.y = h / 4;
      this.fB.rotation.x = Math.PI;

      this.pivot.add(this.fF, this.fB);

      // Kaartenstapel achterin voor 3D-diepte
      const stack = new THREE.Mesh(
        new THREE.BoxGeometry(w - 0.01, h - 0.01, 0.026),
        new THREE.MeshStandardMaterial({ color: 0x141210, roughness: 0.75 })
      );
      stack.position.z = -0.014;

      // Subtiele kaartrandjes aan de zijkant van de stapel
      const stackEdges = new THREE.Mesh(
        new THREE.BoxGeometry(w - 0.004, h - 0.02, 0.018),
        new THREE.MeshStandardMaterial({ color: 0x3b352f, roughness: 0.6 })
      );
      stackEdges.position.z = -0.012;

      this.group.add(stack, stackEdges, this.top, this.bot, this.pivot);
    }

    tex(key) {
      if (!this.cache.has(key)) {
        const c = document.createElement('canvas');
        c.height = 512;
        c.width = Math.round(512 * this.w / this.h);
        this.draw(c.getContext('2d'), c.width, c.height, key);
        this.cache.set(key, halves(c));
        if (this.cache.size > 12) {
          for (const k of this.cache.keys()) {
            if (k !== key && k !== this.key && k !== this.prev) {
              const t = this.cache.get(k);
              t.top.dispose();
              t.bot.dispose();
              this.cache.delete(k);
              break;
            }
          }
        }
      }
      return this.cache.get(key);
    }

    set(key, instant = false) {
      if (key === this.key) return;
      if (this.anim) this.finish();
      const nw = this.tex(key);
      if (this.key === null || instant || reduceMotion) {
        setMap(this.top, nw.top);
        setMap(this.bot, nw.bot);
        this.key = key;
        return;
      }
      const old = this.tex(this.key);
      this.prev = this.key;
      setMap(this.top, nw.top);
      setMap(this.bot, old.bot);
      setMap(this.fF, old.top);
      setMap(this.fB, nw.bot);
      this.pivot.rotation.x = 0;
      this.pivot.visible = true;
      this.anim = { t: 0, nw, clicked: false };
      this.key = key;
    }

    finish() {
      setMap(this.bot, this.anim.nw.bot);
      this.pivot.visible = false;
      this.anim = null;
    }

    update(dt) {
      if (!this.anim) return;
      this.anim.t += dt / 0.44;
      const t = Math.min(1, this.anim.t);
      // Realistische zwaartekrachtversnelling met lichte bounce aan het eind
      let angle;
      if (t < 0.85) {
        const nt = t / 0.85;
        angle = Math.PI * (nt * nt);
      } else {
        if (!this.anim.clicked) {
          this.anim.clicked = true;
          if (isSettingOn('flipSound')) playFlipClick(0.9);
        }
        const bt = (t - 0.85) / 0.15;
        angle = Math.PI - Math.sin(bt * Math.PI) * 0.045;
      }
      this.pivot.rotation.x = angle;
      if (t >= 1) this.finish();
    }
  }

  let xPos = -Wi / 2 + margin;

  // Extended touchscreen state

  const screenHitboxes = [];

  function playSoundPreview(freqs) {
    try {
      if (!audioCtx) {
        const AC = window.AudioContext || window.webkitAudioContext;
        if (!AC) return;
        audioCtx = new AC();
      }
      if (audioCtx.state === 'suspended') audioCtx.resume();
      freqs.forEach((f, idx) => {
        const now = audioCtx.currentTime + idx * 0.14;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(f, now);
        gain.gain.setValueAtTime(0.05, now);
        gain.gain.exponentialRampToValueAtTime(0.0008, now + 0.25);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start(now);
        osc.stop(now + 0.26);
      });
    } catch (e) {}
  }

  const MONTHS = ['JAN', 'FEB', 'MAR', 'APR', 'MAY', 'JUN', 'JUL', 'AUG', 'SEP', 'OCT', 'NOV', 'DEC'];
  function drawIcon(g, type, x, y, s, active = false) {
    g.save();
    g.translate(x, y);
    g.strokeStyle = active ? '#f6c88a' : '#ddd6cb';
    g.fillStyle = active ? '#f6c88a' : '#ddd6cb';
    g.lineWidth = 3.2;
    g.lineCap = 'round';
    g.lineJoin = 'round';
    const r = s * 0.36;
    if (type === 'alarm') {
      g.beginPath(); g.arc(0, 3, r, 0, Math.PI * 2); g.stroke();
      g.beginPath(); g.moveTo(0, 3); g.lineTo(0, -r * 0.5); g.moveTo(0, 3); g.lineTo(r * 0.45, 3 + r * 0.3); g.stroke();
      g.beginPath(); g.arc(-r * 0.85, -r * 0.8, r * 0.38, Math.PI * 1.05, Math.PI * 1.75); g.stroke();
      g.beginPath(); g.arc(r * 0.85, -r * 0.8, r * 0.38, Math.PI * 1.25, Math.PI * 1.95); g.stroke();
    } else if (type === 'sun' || type === 'bright') {
      const cr = type === 'sun' ? r * 0.42 : r * 0.36;
      g.beginPath(); g.arc(0, 0, cr, 0, Math.PI * 2); g.stroke();
      if (type === 'bright') {
        g.beginPath(); g.arc(0, 0, cr, -Math.PI / 2, Math.PI / 2); g.fill();
      }
      for (let i = 0; i < 8; i++) {
        const a = i * Math.PI / 4;
        g.beginPath();
        g.moveTo(Math.cos(a) * cr * 1.6, Math.sin(a) * cr * 1.6);
        g.lineTo(Math.cos(a) * cr * 2.2, Math.sin(a) * cr * 2.2);
        g.stroke();
      }
    } else if (type === 'note') {
      g.beginPath(); g.ellipse(-r * 0.55, r * 0.6, r * 0.28, r * 0.22, -0.4, 0, Math.PI * 2); g.stroke();
      g.beginPath(); g.ellipse(r * 0.55, r * 0.4, r * 0.28, r * 0.22, -0.4, 0, Math.PI * 2); g.stroke();
      g.beginPath(); g.moveTo(-r * 0.3, r * 0.55); g.lineTo(-r * 0.3, -r * 0.7); g.lineTo(r * 0.8, -r * 0.9); g.lineTo(r * 0.8, r * 0.35); g.stroke();
    } else if (type === 'cal') {
      g.strokeRect(-r, -r * 0.8, r * 2, r * 1.8);
      g.beginPath(); g.moveTo(-r, -r * 0.35); g.lineTo(r, -r * 0.35);
      g.moveTo(-r * 0.5, -r * 1.05); g.lineTo(-r * 0.5, -r * 0.6);
      g.moveTo(r * 0.5, -r * 1.05); g.lineTo(r * 0.5, -r * 0.6); g.stroke();
      for (let i = 0; i < 3; i++) for (let j = 0; j < 2; j++) g.fillRect(-r * 0.62 + i * r * 0.55, r * 0.05 + j * r * 0.45, 5, 5);
    } else if (type === 'moon') {
      g.beginPath(); g.arc(0, 0, r * 0.8, 0, Math.PI * 2); g.fill();
      g.fillStyle = '#0b0a09';
      g.beginPath(); g.arc(r * 0.42, -r * 0.3, r * 0.72, 0, Math.PI * 2); g.fill();
    } else if (type === 'lotus') {
      g.beginPath(); g.ellipse(0, 0, r * 0.32, r * 0.75, 0, 0, Math.PI * 2); g.stroke();
      g.beginPath(); g.ellipse(-r * 0.5, r * 0.15, r * 0.25, r * 0.6, -0.7, 0, Math.PI * 2); g.stroke();
      g.beginPath(); g.ellipse(r * 0.5, r * 0.15, r * 0.25, r * 0.6, 0.7, 0, Math.PI * 2); g.stroke();
    } else if (type === 'gear') {
      g.beginPath(); g.arc(0, 0, r * 0.62, 0, Math.PI * 2); g.stroke();
      g.beginPath(); g.arc(0, 0, r * 0.25, 0, Math.PI * 2); g.stroke();
      for (let i = 0; i < 8; i++) {
        const a = i * Math.PI / 4;
        g.beginPath();
        g.moveTo(Math.cos(a) * r * 0.62, Math.sin(a) * r * 0.62);
        g.lineTo(Math.cos(a) * r * 0.95, Math.sin(a) * r * 0.95);
        g.stroke();
      }
    }
    g.restore();
  }

  // Helper for an Apple-style iOS green/grey toggle switch
  function drawIOSToggle(g, x, y, enabled) {
    const w = 86, h = 46, r = 23;
    ctxRR(g, x, y, w, h, r);
    g.fillStyle = enabled ? '#34c759' : '#3a3836';
    g.fill();

    // Subtle inner border
    g.strokeStyle = enabled ? 'rgba(255,255,255,0.18)' : 'rgba(255,255,255,0.08)';
    g.lineWidth = 1.5;
    g.stroke();

    // White knob
    const knobX = enabled ? x + w - r : x + r;
    const knobY = y + r;
    g.beginPath();
    g.arc(knobX, knobY, r - 4, 0, Math.PI * 2);
    g.fillStyle = '#ffffff';
    g.shadowColor = 'rgba(0,0,0,0.35)';
    g.shadowBlur = 6;
    g.shadowOffsetY = 2;
    g.fill();
    g.shadowColor = 'transparent';
    g.shadowBlur = 0;
    g.shadowOffsetY = 0;
  }

  // Helper for the back button, top right of every sub-screen
  function drawSubHeader(g, title, subtitle, now) {
    g.textAlign = 'left';
    g.textBaseline = 'alphabetic';
    g.fillStyle = '#f2ece1';
    g.font = '600 34px "Instrument Sans", system-ui, sans-serif';
    g.fillText(title, 675, 102);

    if (subtitle) {
      g.fillStyle = '#978e84';
      g.font = '400 22px "Instrument Sans", system-ui, sans-serif';
      g.fillText(subtitle, 675, 134);
    }

    // Back-to-menu button, top right
    const bx = 1165, by = 64, bw = 165, bh = 52;
    ctxRR(g, bx, by, bw, bh, 26);
    g.fillStyle = 'rgba(255, 245, 232, 0.08)';
    g.fill();
    g.strokeStyle = 'rgba(255, 235, 210, 0.16)';
    g.lineWidth = 2;
    g.stroke();

    g.fillStyle = '#f5c787';
    g.font = '600 22px "Instrument Sans", system-ui, sans-serif';
    g.textAlign = 'center';
    g.fillText('← Menu', bx + bw / 2, by + 33);
    g.textAlign = 'left';

    screenHitboxes.push({
      x: bx, y: by, w: bw, h: bh,
      action: () => {
        uiState.view = 'menu';
        playRotaryTick();
        drawScreen(now);
      }
    });
  }

  function formatTimeForScreen(now) {
    const is24 = uiState.settings[0].value;
    let h = now.getHours();
    const m = String(now.getMinutes()).padStart(2, '0');
    if (is24) return `${h}:${m}`;
    const suffix = h >= 12 ? 'PM' : 'AM';
    h = h % 12 || 12;
    return `${h}:${m} ${suffix}`;
  }

  function drawScreen(now) {
    const w = sc.width, h = sc.height, g = sx;
    screenHitboxes.length = 0;

    // Deep OLED background
    g.fillStyle = '#090807';
    g.fillRect(0, 0, w, h);

    const vg = g.createRadialGradient(w * 0.28, h * 0.42, 10, w * 0.28, h * 0.42, w * 0.65);
    vg.addColorStop(0, uiState.meditationActive ? 'rgba(130, 190, 175, 0.09)' : 'rgba(255, 215, 170, 0.055)');
    vg.addColorStop(1, 'rgba(0,0,0,0)');
    g.fillStyle = vg;
    g.fillRect(0, 0, w, h);

    // ---------- LEFT FIXED PANEL (Date, Time & Active Alarm) ----------
    g.textAlign = 'left';
    g.textBaseline = 'alphabetic';
    g.fillStyle = '#a49b90';
    g.font = '500 28px "Instrument Sans", system-ui, sans-serif';
    g.fillText(`${DAYS[now.getDay()]} ${now.getDate()} ${MONTHS[now.getMonth()]}${nightModeActive(now) ? '  ·  Night mode' : ''}`, 86, 118);

    const nextAlarm = getNextActiveAlarm();
    const statusText = uiState.snoozed ? 'SNOOZE 9M' : (nextAlarm ? 'ALARM ON' : 'NO ALARM');
    g.fillStyle = nextAlarm ? 'rgba(52, 199, 89, 0.16)' : 'rgba(255,255,255,0.07)';
    ctxRR(g, 405, 88, 185, 42, 21);
    g.fill();
    g.fillStyle = nextAlarm ? '#4ade80' : '#8e867d';
    g.font = '600 20px "Instrument Sans", system-ui, sans-serif';
    g.textAlign = 'center';
    g.fillText(statusText, 497, 116);
    g.textAlign = 'left';

    // Large digital time
    const timeStr = formatTimeForScreen(now);
    g.fillStyle = '#f2ece1';
    g.font = `600 ${timeStr.length > 5 ? 132 : 176}px Archivo, "Helvetica Neue", Arial, sans-serif`;
    g.fillText(timeStr, 80, 294);

    // Status card bottom left (clicks straight through to Alarms)
    ctxRR(g, 80, 336, 510, 128, 22);
    g.fillStyle = 'rgba(255, 245, 232, 0.045)';
    g.fill();
    g.strokeStyle = 'rgba(255, 235, 210, 0.09)';
    g.lineWidth = 2;
    g.stroke();

    screenHitboxes.push({
      x: 80, y: 336, w: 510, h: 128,
      action: () => {
        uiState.view = uiState.view === 'alarms' ? 'menu' : 'alarms';
        playRotaryTick();
        drawScreen(now);
      }
    });

    if (uiState.sleepRunning) {
      const minsLeft = Math.ceil(uiState.sleepRemainingSec / 60);
      drawIcon(g, 'moon', 126, 398, 52, true);
      g.fillStyle = '#ebe4d8';
      g.font = '600 29px "Instrument Sans", system-ui, sans-serif';
      g.fillText(`Sleep timer: ${minsLeft} min left`, 172, 392);
      g.fillStyle = '#978e84';
      g.font = '400 23px "Instrument Sans", system-ui, sans-serif';
      g.fillText('Light dims gradually', 172, 430);
    } else if (nextAlarm) {
      drawIcon(g, 'alarm', 126, 398, 52, true);
      g.fillStyle = '#ebe4d8';
      g.font = '600 30px "Instrument Sans", system-ui, sans-serif';
      g.fillText(`Next: ${nextAlarm.time}`, 172, 392);
      g.fillStyle = '#978e84';
      g.font = '400 23px "Instrument Sans", system-ui, sans-serif';
      g.fillText(`${nextAlarm.label} · ${uiState.soundPreset}`, 172, 430);
    } else {
      drawIcon(g, 'alarm', 126, 398, 52, false);
      g.fillStyle = '#b8afa4';
      g.font = '600 29px "Instrument Sans", system-ui, sans-serif';
      g.fillText('All alarms are off', 172, 392);
      g.fillStyle = '#827a71';
      g.font = '400 23px "Instrument Sans", system-ui, sans-serif';
      g.fillText('Tap here to pick an alarm', 172, 430);
    }

    // Vertical divider
    g.strokeStyle = 'rgba(255,245,230,0.09)';
    g.lineWidth = 2;
    g.beginPath();
    g.moveTo(640, 68);
    g.lineTo(640, h - 68);
    g.stroke();

    // ---------- RIGHT DYNAMIC PANEL ----------
    if (uiState.view === 'menu') {
      const items = [
        ['alarm', 'Alarms', 'alarms'],
        ['sun', 'Wake light', 'light'],
        ['note', 'Sound', 'sound'],
        ['bright', 'Brightness', 'brightness'],
        ['cal', 'Schedule', 'schedule'],
        ['moon', 'Sleep timer', 'sleep'],
        ['lotus', 'Meditation', 'meditation'],
        ['gear', 'Settings', 'settings']
      ];

      const gx = 682, gy = 62, tw = 162, th = 198;
      items.forEach(([type, label, viewKey], i) => {
        const col = i % 4;
        const row = Math.floor(i / 4);
        const cx = gx + col * tw + tw / 2;
        const cy = gy + row * th;
        const boxX = cx - 70, boxY = cy + 4, boxW = 140, boxH = 176;

        const hasActiveBadge =
          (viewKey === 'alarms' && !!nextAlarm) ||
          (viewKey === 'sleep' && uiState.sleepRunning) ||
          (viewKey === 'meditation' && uiState.meditationActive);

        g.fillStyle = hasActiveBadge ? 'rgba(235, 184, 116, 0.12)' : 'rgba(255, 255, 255, 0.03)';
        ctxRR(g, boxX, boxY, boxW, boxH, 20);
        g.fill();
        g.strokeStyle = hasActiveBadge ? 'rgba(235, 184, 116, 0.35)' : 'rgba(255, 255, 255, 0.06)';
        g.lineWidth = 1.5;
        g.stroke();

        drawIcon(g, type, cx, cy + 68, 64, hasActiveBadge);
        g.fillStyle = hasActiveBadge ? '#fff2de' : '#d9d2c7';
        g.font = '500 22px "Instrument Sans", system-ui, sans-serif';
        g.textAlign = 'center';
        g.fillText(label, cx, cy + 146);
        g.textAlign = 'left';

        screenHitboxes.push({
          x: boxX, y: boxY, w: boxW, h: boxH,
          action: () => {
            uiState.view = viewKey;
            playRotaryTick();
            drawScreen(now);
          }
        });
      });

    } else if (uiState.view === 'alarms') {
      // 1. ALARMS: 07:00, 07:30, 07:45, 08:00 with Apple-style green/grey switches
      drawSubHeader(g, 'Alarms', 'Tap the switch to turn it on or off', now);

      uiState.alarms.forEach((alarm, idx) => {
        const ry = 160 + idx * 78;
        const rx = 675, rw = 655, rh = 66;

        ctxRR(g, rx, ry, rw, rh, 18);
        g.fillStyle = alarm.enabled ? 'rgba(52, 199, 89, 0.09)' : 'rgba(255, 255, 255, 0.03)';
        g.fill();
        g.strokeStyle = alarm.enabled ? 'rgba(52, 199, 89, 0.28)' : 'rgba(255, 255, 255, 0.06)';
        g.lineWidth = 1.5;
        g.stroke();

        // Time
        g.fillStyle = alarm.enabled ? '#f5efe6' : '#8c847b';
        g.font = '600 36px Archivo, sans-serif';
        g.fillText(alarm.time, rx + 26, ry + 45);

        // Label
        g.fillStyle = alarm.enabled ? '#b8b0a4' : '#6e6760';
        g.font = '400 23px "Instrument Sans", sans-serif';
        g.fillText(alarm.label, rx + 165, ry + 42);

        // iOS green/grey switch, right
        drawIOSToggle(g, rx + rw - 108, ry + 10, alarm.enabled);

        screenHitboxes.push({
          x: rx, y: ry, w: rw, h: rh,
          action: () => {
            alarm.enabled = !alarm.enabled;
            uiState.snoozed = false;
            playRotaryTick();
            showToast(`Alarm ${alarm.time} ${alarm.enabled ? 'turned on' : 'turned off'}`);
            drawScreen(now);
          }
        });
      });

    } else if (uiState.view === 'light') {
      // 2. WAKE LIGHT: 0%, 15%, 30%, 50%, 75%, 100%
      const curPct = Math.round(dawnTarget * 100);
      drawSubHeader(g, 'Wake light', `Current brightness: ${curPct}% (2200K warm)`, now);

      const levels = [0, 15, 30, 50, 75, 100];
      levels.forEach((pct, i) => {
        const col = i % 3;
        const row = Math.floor(i / 3);
        const bx = 675 + col * 224;
        const by = 172 + row * 142;
        const bw = 206, bh = 122;
        const isCurrent = Math.abs(curPct - pct) <= 4;

        ctxRR(g, bx, by, bw, bh, 22);
        g.fillStyle = isCurrent ? 'rgba(245, 192, 118, 0.22)' : 'rgba(255, 255, 255, 0.035)';
        g.fill();
        g.strokeStyle = isCurrent ? '#f5c787' : 'rgba(255, 255, 255, 0.08)';
        g.lineWidth = isCurrent ? 2.5 : 1.5;
        g.stroke();

        // Visual light dot
        g.beginPath();
        g.arc(bx + bw / 2, by + 42, 14, 0, Math.PI * 2);
        g.fillStyle = pct === 0 ? '#3a3530' : `rgba(255, 198, 115, ${0.25 + (pct / 100) * 0.75})`;
        g.fill();

        g.fillStyle = isCurrent ? '#fff5e6' : '#dcd4c8';
        g.font = '600 32px Archivo, sans-serif';
        g.textAlign = 'center';
        g.fillText(`${pct}%`, bx + bw / 2, by + 96);
        g.textAlign = 'left';

        screenHitboxes.push({
          x: bx, y: by, w: bw, h: bh,
          action: () => {
            if (demoActive) stopDemo();
            setDawnTarget(pct / 100);
            playRotaryTick();
            showToast(`Wake light set to ${pct}%`);
            drawScreen(now);
          }
        });
      });

    } else if (uiState.view === 'sound') {
      // 3. SOUND: list of alarm sounds + Custom
      drawSubHeader(g, 'Alarm sound', 'Tap to select and preview', now);

      uiState.sounds.forEach((snd, idx) => {
        const ry = 156 + idx * 64;
        const rx = 675, rw = 655, rh = 55;
        const selected = uiState.soundPreset === snd.name;

        ctxRR(g, rx, ry, rw, rh, 15);
        g.fillStyle = selected ? 'rgba(245, 192, 118, 0.16)' : 'rgba(255, 255, 255, 0.03)';
        g.fill();
        g.strokeStyle = selected ? 'rgba(245, 192, 118, 0.5)' : 'rgba(255, 255, 255, 0.06)';
        g.lineWidth = 1.5;
        g.stroke();

        // Radio indicator
        g.beginPath();
        g.arc(rx + 30, ry + rh / 2, 11, 0, Math.PI * 2);
        g.strokeStyle = selected ? '#f5c787' : '#7a7269';
        g.lineWidth = 2.5;
        g.stroke();
        if (selected) {
          g.beginPath();
          g.arc(rx + 30, ry + rh / 2, 5.5, 0, Math.PI * 2);
          g.fillStyle = '#f5c787';
          g.fill();
        }

        g.fillStyle = selected ? '#fff4e4' : '#e0d8cc';
        g.font = '600 23px "Instrument Sans", sans-serif';
        g.fillText(snd.name, rx + 58, ry + 34);

        g.fillStyle = '#8e867c';
        g.font = '400 19px "Instrument Sans", sans-serif';
        g.textAlign = 'right';
        g.fillText(snd.desc, rx + rw - 22, ry + 34);
        g.textAlign = 'left';

        screenHitboxes.push({
          x: rx, y: ry, w: rw, h: rh,
          action: () => {
            uiState.soundPreset = snd.name;
            playSoundPreview(snd.freq);
            showToast(`Alarm sound: ${snd.name}`);
            drawScreen(now);
          }
        });
      });

    } else if (uiState.view === 'brightness') {
      // 4. BRIGHTNESS: back touchscreen brightness up/down
      const bPct = Math.round(uiState.brightness * 100);
      drawSubHeader(g, 'Screen brightness', `OLED display level: ${bPct}%`, now);

      const barX = 765, barY = 240, barW = 475, barH = 54;

      // Minus button (-)
      ctxRR(g, 675, barY, 68, barH, 16);
      g.fillStyle = 'rgba(255,255,255,0.08)';
      g.fill();
      g.fillStyle = '#f2ece1';
      g.font = '600 36px Archivo, sans-serif';
      g.textAlign = 'center';
      g.fillText('−', 709, barY + 39);

      // Plus button (+)
      ctxRR(g, 1262, barY, 68, barH, 16);
      g.fillStyle = 'rgba(255,255,255,0.08)';
      g.fill();
      g.fillStyle = '#f2ece1';
      g.fillText('+', 1296, barY + 39);
      g.textAlign = 'left';

      // Slider track
      ctxRR(g, barX, barY, barW, barH, 27);
      g.fillStyle = '#1e1b18';
      g.fill();
      g.strokeStyle = 'rgba(255,255,255,0.12)';
      g.lineWidth = 2;
      g.stroke();

      // Filled bar
      const fillW = Math.max(54, barW * uiState.brightness);
      ctxRR(g, barX, barY, fillW, barH, 27);
      const bGrad = g.createLinearGradient(barX, 0, barX + barW, 0);
      bGrad.addColorStop(0, '#a87842');
      bGrad.addColorStop(1, '#f8cf92');
      g.fillStyle = bGrad;
      g.fill();

      // Thumb knob
      g.beginPath();
      g.arc(barX + fillW - 27, barY + barH / 2, 20, 0, Math.PI * 2);
      g.fillStyle = '#ffffff';
      g.fill();

      // Quick presets below the bar
      [20, 50, 80, 100].forEach((preset, idx) => {
        const px = 675 + idx * 168;
        const py = 345;
        ctxRR(g, px, py, 150, 58, 16);
        g.fillStyle = Math.abs(bPct - preset) <= 4 ? 'rgba(245, 192, 118, 0.2)' : 'rgba(255,255,255,0.04)';
        g.fill();
        g.fillStyle = '#e6dfd3';
        g.font = '600 23px "Instrument Sans", sans-serif';
        g.textAlign = 'center';
        g.fillText(`${preset}%`, px + 75, py + 37);
        g.textAlign = 'left';

        screenHitboxes.push({
          x: px, y: py, w: 150, h: 58,
          action: () => {
            uiState.brightness = preset / 100;
            playRotaryTick();
            drawScreen(now);
          }
        });
      });

      // Hitboxes for -, + and the bar
      screenHitboxes.push({
        x: 675, y: barY, w: 68, h: barH,
        action: () => {
          uiState.brightness = Math.max(0.15, uiState.brightness - 0.1);
          playRotaryTick();
          drawScreen(now);
        }
      });
      screenHitboxes.push({
        x: 1262, y: barY, w: 68, h: barH,
        action: () => {
          uiState.brightness = Math.min(1.0, uiState.brightness + 0.1);
          playRotaryTick();
          drawScreen(now);
        }
      });
      screenHitboxes.push({
        x: barX, y: barY, w: barW, h: barH,
        dragType: 'brightness',
        action: (cx) => {
          const ratio = Math.max(0.15, Math.min(1.0, (cx - barX) / barW));
          uiState.brightness = ratio;
          drawScreen(now);
        }
      });

    } else if (uiState.view === 'schedule') {
      // 5. SCHEDULE & WAKE HISTORY
      drawSubHeader(g, 'Weekly schedule & history', 'Planned wake time vs. actual wake-up', now);

      // Column headers
      g.fillStyle = '#8e867c';
      g.font = '600 20px "Instrument Sans", sans-serif';
      g.fillText('DAY', 690, 174);
      g.fillText('PLANNED', 810, 174);
      g.fillText('WOKE UP', 990, 174);
      g.fillText('STATUS', 1190, 174);

      uiState.schedule.forEach((row, idx) => {
        const ry = 188 + idx * 41;
        ctxRR(g, 675, ry, 655, 35, 10);
        g.fillStyle = idx % 2 === 0 ? 'rgba(255,255,255,0.035)' : 'rgba(255,255,255,0.015)';
        g.fill();

        g.fillStyle = '#f5c787';
        g.font = '600 21px Archivo, sans-serif';
        g.fillText(row.day, 692, ry + 25);

        g.fillStyle = '#d6cfc4';
        g.font = '500 21px "Instrument Sans", sans-serif';
        g.fillText(row.planned, 815, ry + 25);

        g.fillStyle = '#f2ece1';
        g.font = '600 21px "Instrument Sans", sans-serif';
        g.fillText(row.actual, 1000, ry + 25);

        g.fillStyle = row.status === 'ok' ? '#4ade80' : '#fbbf24';
        g.font = '500 19px "Instrument Sans", sans-serif';
        g.fillText(row.status === 'ok' ? '● On time' : '● 1x Snooze', 1185, ry + 25);
      });

    } else if (uiState.view === 'sleep') {
      // 6. SLEEP TIMER WITH ROUND SLEEP ARC (bottom-left = 0 min, bottom-right = 60 min)
      drawSubHeader(g, 'Sleep timer', 'Drag along the arc from bottom-left (0m) to bottom-right (60m)', now);

      const cx = 920, cy = 325, radius = 128;
      // Arc runs clockwise from bottom-left (0.75 * PI = 135°) via the top (1.5 * PI) to bottom-right (2.25 * PI = 405°)
      const startAngle = Math.PI * 0.75;
      const totalSweep = Math.PI * 1.5;
      const fraction = uiState.sleepMinutes / 60;
      const currentAngle = startAngle + totalSweep * fraction;

      // Background arc
      g.beginPath();
      g.arc(cx, cy, radius, startAngle, startAngle + totalSweep, false);
      g.strokeStyle = '#26221e';
      g.lineWidth = 22;
      g.lineCap = 'round';
      g.stroke();

      // Active colored arc
      if (fraction > 0.01) {
        g.beginPath();
        g.arc(cx, cy, radius, startAngle, currentAngle, false);
        const arcGrad = g.createLinearGradient(cx - radius, cy, cx + radius, cy);
        arcGrad.addColorStop(0, '#8b6844');
        arcGrad.addColorStop(1, '#f7c882');
        g.strokeStyle = arcGrad;
        g.lineWidth = 22;
        g.lineCap = 'round';
        g.stroke();
      }

      // Labels bottom-left (0m) and bottom-right (60m)
      g.fillStyle = '#8e867c';
      g.font = '500 20px "Instrument Sans", sans-serif';
      g.textAlign = 'center';
      g.fillText('0 min', cx - radius * 0.88, cy + radius * 0.96);
      g.fillText('60 min', cx + radius * 0.88, cy + radius * 0.96);

      // Large time in the center of the circle
      const displayMins = uiState.sleepRunning ? Math.ceil(uiState.sleepRemainingSec / 60) : uiState.sleepMinutes;
      g.fillStyle = '#f2ece1';
      g.font = '600 58px Archivo, sans-serif';
      g.fillText(`${displayMins}`, cx, cy + 12);
      g.fillStyle = '#a49b90';
      g.font = '500 22px "Instrument Sans", sans-serif';
      g.fillText('minutes', cx, cy + 44);
      g.textAlign = 'left';

      // Drag handle on the arc
      const handleX = cx + Math.cos(currentAngle) * radius;
      const handleY = cy + Math.sin(currentAngle) * radius;
      g.beginPath();
      g.arc(handleX, handleY, 19, 0, Math.PI * 2);
      g.fillStyle = '#ffffff';
      g.fill();
      g.lineWidth = 4;
      g.strokeStyle = '#d99b52';
      g.stroke();

      // Start / Stop button right of the circle
      const btnX = 1120, btnY = 275, btnW = 200, btnH = 74;
      ctxRR(g, btnX, btnY, btnW, btnH, 22);
      g.fillStyle = uiState.sleepRunning ? 'rgba(239, 68, 68, 0.22)' : 'rgba(52, 199, 89, 0.22)';
      g.fill();
      g.strokeStyle = uiState.sleepRunning ? '#f87171' : '#4ade80';
      g.lineWidth = 2;
      g.stroke();

      g.fillStyle = uiState.sleepRunning ? '#fca5a5' : '#86efac';
      g.font = '600 25px "Instrument Sans", sans-serif';
      g.textAlign = 'center';
      g.fillText(uiState.sleepRunning ? 'Stop timer' : 'Start timer', btnX + btnW / 2, btnY + 46);
      g.textAlign = 'left';

      // Hitbox for dragging along the circular arc
      const updateSleepFromPoint = (px, py) => {
        let ang = Math.atan2(py - cy, px - cx);
        if (ang < 0) ang += Math.PI * 2;
        // Normalize relative to startAngle (0.75 * PI)
        let rel = ang - startAngle;
        if (rel < 0) rel += Math.PI * 2;

        if (rel > totalSweep) {

          uiState.sleepMinutes = mins;
          uiState.sleepRemainingSec = mins * 60;
          playRotaryTick();
        }
        drawScreen(now);

  // ---------- Camera, orbit, zoom & raycasting interaction ----------
  const FRONT_ANGLE = 0;
  const BACK_ANGLE = Math.PI;

  let rotY = FRONT_ANGLE;
  let rotTarget = FRONT_ANGLE;
  let elev = 0.17;
  let elevTarget = 0.17;
  let zoomFactor = 0.84;
  let zoomTarget = 0.84;

  let dragging = false;
  let pointerMoved = false;
  let downX = 0, downY = 0;
  let lx = 0, ly = 0;
  let knobPressAnim = 0;
  let knobRotation = 0;

  function nearestAngle(target) {
    return target + 2 * Math.PI * Math.round((rotY - target) / (2 * Math.PI));
  }

  const raycaster = new THREE.Raycaster();
  const pointerNDC = new THREE.Vector2();

  function updatePointerNDC(e) {
    const rect = renderer.domElement.getBoundingClientRect();
    pointerNDC.x = ((e.clientX - rect.left) / rect.width) * 2 - 1;
    pointerNDC.y = -((e.clientY - rect.top) / rect.height) * 2 + 1;
  }

  function handleCanvasClick(e) {
    updatePointerNDC(e);
    raycaster.setFromCamera(pointerNDC, camera);

    // 1. Check rotary knob click (Snooze / Dim)
    const knobHits = raycaster.intersectObjects(knobRotator.children, true);
    if (knobHits.length > 0) {
      knobPressAnim = 1.0;
      knobRotation += Math.PI / 6;
      playRotaryTick();
      if (demoActive) {
        stopDemo();

          uiState.snoozed = true;
          setDawnTarget(0.25);
          showToast('Snooze activated (9 min) · Light dimmed');
        } else {

          const active = getNextActiveAlarm();
          if (active) active.enabled = false;
          setDawnTarget(0);
          showToast('Alarm turned off (snooze is off)');
        }
      } else {
        const nextLevel = dawn > 0.7 ? 0.0 : (dawn > 0.2 ? 1.0 : 0.45);
        setDawnTarget(nextLevel);
        showToast(`Rotary knob: Wake light ${Math.round(nextLevel * 100)}%`);
      }
      drawScreen(getSimulatedNow());
      return;
    }

    // 2. Check back touchscreen click
    const screenHits = raycaster.intersectObject(screenMesh);
    if (screenHits.length > 0 && screenHits[0].uv) {
      const uv = screenHits[0].uv;
      const cx = uv.x * sc.width;
      const cy = (1 - uv.y) * sc.height;
      for (const box of screenHitboxes) {
        if (cx >= box.x && cx <= box.x + box.w && cy >= box.y && cy <= box.y + box.h) {
          box.action(cx, cy);
          return;
        }
      }
    }
  }

  const cv = renderer.domElement;
  cv.addEventListener('pointerdown', e => {
    downX = lx = e.clientX;
    downY = ly = e.clientY;
    pointerMoved = false;
    activeSliderDrag = null;

    // First check whether we're pressing a draggable control on the touchscreen (Sleep timer arc or Brightness)
    updatePointerNDC(e);
    raycaster.setFromCamera(pointerNDC, camera);
    const screenHits = raycaster.intersectObject(screenMesh);
    if (screenHits.length > 0 && screenHits[0].uv) {
      const cx = screenHits[0].uv.x * sc.width;
      const cy = (1 - screenHits[0].uv.y) * sc.height;
      for (const box of screenHitboxes) {
        if (box.dragType && cx >= box.x && cx <= box.x + box.w && cy >= box.y && cy <= box.y + box.h) {
          activeSliderDrag = box;
          box.action(cx, cy);
          cv.setPointerCapture(e.pointerId);
          return;
        }
      }
    }

    dragging = true;
    cv.setPointerCapture(e.pointerId);
  });

  cv.addEventListener('pointermove', e => {
    if (activeSliderDrag) {
      updatePointerNDC(e);
      raycaster.setFromCamera(pointerNDC, camera);
      const screenHits = raycaster.intersectObject(screenMesh);
      if (screenHits.length > 0 && screenHits[0].uv) {
        const cx = screenHits[0].uv.x * sc.width;
        const cy = (1 - screenHits[0].uv.y) * sc.height;
        activeSliderDrag.action(cx, cy);
      }
      return;
    }

    if (dragging) {
      const dx = e.clientX - lx;
      const dy = e.clientY - ly;
      if (Math.hypot(e.clientX - downX, e.clientY - downY) > 5) {
        pointerMoved = true;
        if (!showcaseMode) clearActiveViewButtons();

      if (!showcaseMode) {
        rotY += dx * 0.0085;
        rotTarget = rotY;
        elev = Math.min(1.05, Math.max(0.03, elev + dy * 0.0045));
        elevTarget = elev;

      lx = e.clientX;
      ly = e.clientY;

  // ---------- Clock & moon phase calculation ----------
  function moonPhase(d) {
    const days = (d.getTime() - Date.UTC(2000, 0, 6, 18, 14)) / 86400000;
    return ((days / 29.530588853) % 1 + 1) % 1;
  }

  function getSimulatedNow() {

  }

  let lastScreenKey = '';
  function tick(forceScreen = false) {
    const now = getSimulatedNow();
    mods[0].set(String(now.getHours()));
    mods[1].set(String(now.getMinutes()).padStart(2, '0'));
    mods[2].set(DAYS[now.getDay()] + '|' + (Math.round(moonPhase(now) * 28) / 28).toFixed(3));

    const sk = `${now.getHours()}:${now.getMinutes()}`;
    if (sk !== lastScreenKey || forceScreen) {
      lastScreenKey = sk;
      drawScreen(now);
    }
  }

  resize();

  // ---------- Animation loop ----------
  const stripColorOff = new THREE.Color(0x3a2a1c);
  const stripColorOn = new THREE.Color(0xffe0b2);
  const ledOff = new THREE.Color(0x4a3828);
  const ledOn = new THREE.Color(0xffcf87);

  let lastTime = performance.now();

  function frame(nowTime) {
    const dt = Math.min(0.05, (nowTime - lastTime) / 1000);
    lastTime = nowTime;

    // Camera & rotation interpolation
    if (!dragging) {
      const lerpSpeed = reduceMotion ? 60 : 4.5;
      rotY += (rotTarget - rotY) * Math.min(1, dt * lerpSpeed);
      elev += (elevTarget - elev) * Math.min(1, dt * lerpSpeed);
    }
    zoomFactor += (zoomTarget - zoomFactor) * Math.min(1, dt * 6);
    clock.rotation.y = rotY;

    // Rotary knob animation (press + turn)
    knobRotator.rotation.y += (knobRotation - knobRotator.rotation.y) * Math.min(1, dt * 14);
    if (knobPressAnim > 0) {
      knobPressAnim = Math.max(0, knobPressAnim - dt * 5.5);
      knobRotator.position.y = 0.014 - Math.sin(knobPressAnim * Math.PI) * 0.008;
    }

    // Responsive camera distance so the clock always stays prominently centered
    const vfov = camera.fov * Math.PI / 180;
    const hfov = 2 * Math.atan(Math.tan(vfov / 2) * (camera.aspect || 1.33));
    const baseDist = Math.max(2.35 / Math.tan(hfov / 2), 1.45 / Math.tan(vfov / 2), 4.8);
    const dist = baseDist * zoomFactor;

    camera.position.set(0, Math.sin(elev) * dist, Math.cos(elev) * dist);
    camera.lookAt(0, 0, 0);

    // Wake light (Dawn Simulator) interpolation & sleep timer countdown
    if (uiState.sleepRunning) {
      uiState.sleepRemainingSec = Math.max(0, uiState.sleepRemainingSec - dt);
      const ratio = uiState.sleepRemainingSec / Math.max(1, uiState.sleepMinutes * 60);
      setDawnTarget(ratio * 0.6);
      if (uiState.sleepRemainingSec <= 0) {
        uiState.sleepRunning = false;
        setDawnTarget(0);
        showToast('Sleep timer finished · Good night');
        drawScreen(getSimulatedNow());
      }
    }

    const dawnSpeed = demoActive ? 0.16 : 3.2;
    dawn += (dawnTarget - dawn) * Math.min(1, dt * dawnSpeed);
    if (!demoActive && Math.abs(dawnTarget - dawn) > 0.005) {
      dawnSlider.value = Math.round(dawn * 100);
      dawnPct.textContent = `${Math.round(dawn * 100)}%`;
    }

    // Optional breathing pulse during meditation
    let pulse = 0;
    if (uiState.meditationActive) {
      pulse = Math.sin(nowTime * 0.0012) * 0.14;
    }
    const effectiveDawn = Math.max(0, Math.min(1, dawn + pulse));
    const easedDawn = effectiveDawn * effectiveDawn * (3 - 2 * effectiveDawn);

    stripMat.color.copy(stripColorOff).lerp(stripColorOn, Math.min(1, easedDawn * 1.25));
    ledRingMat.color.copy(ledOff).lerp(ledOn, 0.35 + easedDawn * 0.65);
    glowMat.opacity = easedDawn * 0.72;
    stripLight.intensity = easedDawn * 2.8;
    keyLight.intensity = 2.1 + easedDawn * 0.65;
    hemiLight.intensity = 0.78 + easedDawn * 0.38;

    stage.style.setProperty('--dawn', easedDawn.toFixed(3));
    headerLed.style.opacity = (0.35 + easedDawn * 0.65).toFixed(2);

    tick();
    mods.forEach(m => m.update(dt));

    renderer.render(scene, camera);
    requestAnimationFrame(frame);
  }

  // Start immediately without waiting for window.load (the script already runs async)
  tick(true);
  requestAnimationFrame(frame);
})();
</script>
